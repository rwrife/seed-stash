name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release (must match checked-out commit)
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[A-Za-z0-9.]+)?$') { throw 'Expected existing vMAJOR.MINOR.PATCH tag' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}
      - name: Verify tag and source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $tagCommit = (git rev-list -n 1 "refs/tags/$env:RELEASE_TAG").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (git rev-parse HEAD).Trim()) { throw 'Checkout does not match release tag' }
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.sha }}' -ne $tagCommit) { throw 'Tag event SHA mismatch' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - run: flutter build windows --release
      - name: Package complete portable build
        shell: pwsh
        run: |
          $dir = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$dir/seed_stash.exe") -or !(Test-Path "$dir/data")) { throw 'Windows release missing exe or data directory' }
          Compress-Archive -Path "$dir/*" -DestinationPath seed-stash-windows.zip
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'seed-stash-windows.zip'))
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            if ('seed_stash.exe' -notin $names -or !(@($names | Where-Object { $_ -like 'data/*' }).Count)) { throw 'ZIP missing executable or data' }
          } finally { $archive.Dispose() }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName > $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG seed-stash-windows.zip --clobber
          } else {
            gh release create $env:RELEASE_TAG seed-stash-windows.zip --title $env:RELEASE_TAG --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $assets = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if (!( $assets.assets | Where-Object { $_.name -eq 'seed-stash-windows.zip' -and $_.size -gt 0 })) { throw 'Release ZIP not found or empty' }
